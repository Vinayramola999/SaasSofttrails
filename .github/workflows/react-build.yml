name: React Production Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build React App
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Repo checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Node setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Build (source map OFF to save memory)
      - name: Build project
        env:
          GENERATE_SOURCEMAP: false
        run: npm run build

      # 5️⃣ Upload build artifact (optional but recommended)
      - name: Upload build folder
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: build
